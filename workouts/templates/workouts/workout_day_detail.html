{% load workout_tags %}
{% if current_day %}
  <!-- نمایش محتوای روز انتخاب شده -->
  <div class="blog-content prose prose-lg md:prose-xl dark:prose-invert max-w-none prose-headings:text-[var(--color-text-main)] prose-a:text-[var(--color-primary)]">
    <!-- هدر مقاله -->
    <div class="border-b border-gray-100 dark:border-gray-800 pb-8 mb-8">
      <span class="inline-block text-sm font-bold text-[var(--color-primary)] bg-[var(--color-primary)]/10 px-3 py-1 rounded-lg mb-4">برنامه روز {{ current_day.day_number }}</span>
      <h2 class="text-3xl md:text-4xl font-extrabold text-[var(--color-text-main)] leading-tight">{{ current_day.title }}</h2>
    </div>

    <!-- فرض بر این است که از فیلتر markdown استفاده می‌کنید -->
    <div class="text-[var(--color-text-main)] leading-loose">{{ current_day.content|markdown|safe }}</div>
  </div>
{% else %}
  <!-- حالت پیش‌فرض (Empty State) -->
  <div class="flex flex-col items-center justify-center h-full min-h-[400px] text-center">
    <div class="relative mb-6">
      <div class="absolute inset-0 bg-[var(--color-primary)]/20 rounded-full blur-2xl animate-pulse"></div>
      <div class="relative bg-[var(--color-bg-surface)] border-2 border-dashed border-[var(--color-primary)]/30 w-24 h-24 rounded-full flex items-center justify-center">
        <svg class="w-10 h-10 text-[var(--color-primary)]/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
    </div>
    <h2 class="text-2xl font-bold text-[var(--color-text-main)] mb-3">یک روز تمرینی را انتخاب کنید</h2>
    <p class="text-base text-[var(--color-text-muted)] max-w-sm mx-auto leading-relaxed">برای مشاهده جزئیات، ویدیوها و محتوای تمرین، از منوی سمت راست یکی از روزها را انتخاب کنید.</p>
  </div>
{% endif %}
