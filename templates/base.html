<!DOCTYPE html>
{% load static %}
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'fonts/fontawesome/css/all.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/main_style.css' %}" />
    {% block extra_head %}
    {% endblock %}
    <title>
      {% block title %}

      {% endblock %}
    </title>
  </head>

  <body class="bg-default text-main antialiased min-h-screen flex flex-col selection:bg-primary selection:text-white overflow-x-hidden">
    <header>
      {% if user.is_authenticated %}
        <form method="post" class="max-w-120 mx-5 my-3 float-right" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="form-button">خروج</button>
        </form>
      {% endif %}
    </header>

    <main class="flex-1 w-full flex flex-col">
      {% block body %}

      {% endblock %}
    </main>

    <footer></footer>

    {% block script %}

    {% endblock %}
  </body>
</html>
